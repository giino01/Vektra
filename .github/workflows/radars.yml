# Base de radars Europe (OpenStreetMap + MapAtlas) pour l'application VEKTRA.
# Fabriquée chaque lundi à 02:17 UTC, ou à la demande (bouton « Run workflow »).
# L'application télécharge radars/radars_v3.txt (OSM + MapAtlas, à partir de la 2.6.2-alfa5),
# radars_v2.txt (OSM, jusqu'à la 2.6.2-alfa4) ou radars_europe.txt (jusqu'à la 2.5.0) quand la
# fiche *_meta.json annonce une version plus récente. Si les serveurs échouent, les radars déjà
# connus sont conservés.
name: Base radars Europe

on:
  schedule:
    - cron: "17 2 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: radars
  cancel-in-progress: false

jobs:
  radars:
    runs-on: ubuntu-24.04
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v5

      - name: Télécharger les radars d'Europe (OpenStreetMap, MapAtlas) et écrire les trois formats
        env:
          RADARS_MINUTES: "170"
        run: |
          python3 radars/build_radars.py weekly radars
          # Radars identiques (fiche inchangée) : on n'enregistre pas un simple changement de date d'en-tête.
          for pair in radars_europe:radars_meta radars_v2:radars_v2_meta radars_v3:radars_v3_meta; do
            data="radars/${pair%%:*}.txt"; meta="radars/${pair##*:}.json"
            if [ -z "$(git status --porcelain "$meta")" ] && git ls-files --error-unmatch "$data" >/dev/null 2>&1; then
              git checkout -- "$data"
            fi
          done

      - name: Enregistrer dans le dépôt
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add radars/
          if git diff --cached --quiet; then echo "Aucun changement."; exit 0; fi
          git commit -q -m "Base radars Europe : mise à jour hebdomadaire"
          for i in 1 2 3 4; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0
            sleep 15
          done
          exit 1
