# Base de radars Europe (OpenStreetMap) pour l'application VEKTRA.
# Fabriquée chaque lundi à 02:17 UTC, ou à la demande (bouton « Run workflow »).
# L'application télécharge radars/radars_v2.txt (ou radars_europe.txt pour les versions
# jusqu'à la 2.5.0) quand la fiche *_meta.json annonce une version plus récente. Si les serveurs échouent, les radars déjà connus sont conservés.
name: Base radars Europe

on:
  schedule:
    - cron: "17 2 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: radars
  cancel-in-progress: false

jobs:
  radars:
    runs-on: ubuntu-24.04
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v5

      - name: Télécharger les radars d'Europe (OpenStreetMap) et écrire les deux formats
        env:
          RADARS_MINUTES: "170"
        run: |
          python3 radars/build_radars.py weekly radars
          # Radars identiques (fiches inchangées) : on n'enregistre pas un simple changement de date d'en-tête.
          if [ -z "$(git status --porcelain radars/radars_meta.json radars/radars_v2_meta.json)" ]; then
            git checkout -- radars/radars_europe.txt radars/radars_v2.txt
          fi

      - name: Enregistrer dans le dépôt
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add radars/
          if git diff --cached --quiet; then echo "Aucun changement."; exit 0; fi
          git commit -q -m "Base radars Europe : mise à jour hebdomadaire"
          for i in 1 2 3 4; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0
            sleep 15
          done
          exit 1
